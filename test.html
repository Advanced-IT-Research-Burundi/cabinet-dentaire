<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Scientifique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50, #3498db);
        }

        .calculator {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        .display {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 24px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .operator {
            background: #3498db;
            color: white;
        }

        .operator:hover {
            background: #2980b9;
        }

        .number {
            background: #e0e0e0;
        }

        .number:hover {
            background: #d0d0d0;
        }

        .special {
            background: #e74c3c;
            color: white;
        }

        .special:hover {
            background: #c0392b;
        }

        .scientific {
            background: #2ecc71;
            color: white;
        }

        .scientific:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <span id="previous">0</span>
            <span id="current">0</span>
        </div>
        <div class="buttons">
            <!-- Fonctions spéciales -->
            <button class="special" onclick="clearAll()">C</button>
            <button class="special" onclick="clearLast()">CE</button>
            <button class="scientific" onclick="calculate('sqrt')">√</button>
            <button class="operator" onclick="appendOperator('/')">/</button>

            <!-- Nombres et fonctions -->
            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('*')">×</button>

            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('-')">-</button>

            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <!-- Fonctions scientifiques -->
            <button class="scientific" onclick="calculate('sin')">sin</button>
            <button class="scientific" onclick="calculate('cos')">cos</button>
            <button class="scientific" onclick="calculate('tan')">tan</button>
            <button class="scientific" onclick="calculate('pi')">π</button>

            <button class="number" onclick="appendNumber('0')">0</button>
            <button class="number" onclick="appendNumber('.')">.</button>
            <button class="special" onclick="calculate('factorial')">!</button>
            <button class="operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let current = '0';
        let previous = '';
        let operation = null;
        let shouldResetScreen = false;

        function clearAll() {
            current = '0';
            previous = '';
            operation = null;
            shouldResetScreen = false;
            updateDisplay();
        }

        function clearLast() {
            if (current.length === 1) {
                current = '0';
            } else {
                current = current.slice(0, -1);
            }
            updateDisplay();
        }

        function appendNumber(num) {
            if (shouldResetScreen) {
                current = num;
                shouldResetScreen = false;
            } else if (current === '0' && num !== '.') {
                current = num;
            } else {
                current += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (current === '0') return;
            if (previous !== '') calculate();
            operation = op;
            previous = current;
            current = '0';
            updateDisplay();
        }

        function calculate(func = null) {
            if (func === 'sqrt') {
                current = Math.sqrt(parseFloat(current)).toString();
            } else if (func === 'sin') {
                current = Math.sin(parseFloat(current) * Math.PI / 180).toString();
            } else if (func === 'cos') {
                current = Math.cos(parseFloat(current) * Math.PI / 180).toString();
            } else if (func === 'tan') {
                current = Math.tan(parseFloat(current) * Math.PI / 180).toString();
            } else if (func === 'pi') {
                current = Math.PI.toString();
            } else if (func === 'factorial') {
                current = factorial(parseFloat(current)).toString();
            } else {
                let prev = parseFloat(previous);
                let curr = parseFloat(current);
                if (isNaN(prev) || isNaN(curr)) return;

                let result = 0;
                switch(operation) {
                    case '+':
                        result = prev + curr;
                        break;
                    case '-':
                        result = prev - curr;
                        break;
                    case '*':
                        result = prev * curr;
                        break;
                    case '/':
                        if (curr === 0) {
                            alert('Division par zéro impossible!');
                            return;
                        }
                        result = prev / curr;
                        break;
                }
                current = result.toString();
                operation = null;
                previous = '';
            }
            shouldResetScreen = true;
            updateDisplay();
        }

        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function updateDisplay() {
            document.getElementById('current').textContent = current;
            document.getElementById('previous').textContent = previous;
        }

        // Gestion du clavier
        document.addEventListener('keydown', function(e) {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber(e.key);
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                appendOperator(e.key === '*' ? '×' : e.key);
            }
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Backspace') clearLast();
            if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
